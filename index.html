<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ffe0eb,
                    #fff7fa
                );
        }

        .card {

            width: 90%;
            max-width: 650px;

            min-height: 400px;

            background: white;

            border-radius: 25px;

            padding: 40px 25px;

            text-align: center;

            box-shadow:
                0 20px 50px
                rgba(180, 60, 100, 0.18);
        }

        .heart {
            font-size: 50px;
        }

        h1 {
            color: #e83e6f;

            margin-top: 10px;
        }

        #progress {

            color: #a27a86;

            font-size: 14px;

            margin-bottom: 20px;
        }

        #question {

            min-height: 80px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 23px;

            font-weight: bold;

            color: #442631;

            padding: 10px;
        }

        .button-area {

            position: relative;

            height: 150px;

            width: 100%;

            margin-top: 10px;

            overflow: hidden;
        }

        button {

            border: none;

            border-radius: 30px;

            padding: 14px 32px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition:
                left 0.15s ease,
                top 0.15s ease;

            box-shadow:
                0 7px 18px
                rgba(0,0,0,0.12);
        }

        #yes {

            position: absolute;

            left: 35%;

            top: 40px;

            background: #ff4f81;

            color: white;
        }

        #no {

            position: absolute;

            left: 55%;

            top: 40px;

            background: #eeeeee;

            color: #444;
        }

        #message {

            min-height: 30px;

            color: #e83e6f;

            font-weight: bold;
        }

        #finalScreen {

            display: none;
        }

        #finalImage {

            width: 100%;

            max-width: 400px;

            border-radius: 20px;

            margin-top: 20px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.2);
        }

        .finalText {

            font-size: 20px;

            line-height: 1.6;

            color: #555;
        }

    </style>

</head>


<body>


<div class="card">


    <!-- QUESTION SCREEN -->

    <div id="questionScreen">

        <div class="heart">
            ❤️
        </div>

        <h1>
            One Little Question...
        </h1>

        <div id="progress"></div>

        <div id="question"></div>


        <div class="button-area"
             id="buttonArea">

            <button id="yes">
                Yes ❤️
            </button>

            <button id="no">
                No 😜
            </button>

        </div>


        <div id="message"></div>

    </div>



    <!-- FINAL SCREEN -->

    <div id="finalScreen">

        <div class="heart">
            🥹❤️
        </div>

        <h1>
            You Said YES! 🎉
        </h1>

        <p class="finalText">

            I knew you would say YES! 😍

            <br><br>

            You are my favourite person ❤️

            <br>

            Forever Us 🥰

        </p>


        <!--
        Put your photo in the same folder
        and name it:

        final-photo.jpg
        -->

        <img
            id="finalImage"
            src="final-photo.jpg"
            alt="Our Photo"
        >


        <p class="finalText">

            ❤️ I Love You ❤️

        </p>

    </div>


</div>



<script>

    // ==========================
    // QUESTIONS
    // ==========================

    const questions = [

        "Kya tumne mujhe propose kiya tha? 💍",

        "Kya main tumhara favourite notification hoon? 📱❤️",

        "Kya main tumhari life ka favourite headache hoon? 😂❤️",

        "Kya tum mere saath lifetime bakchodi karogi? 😜",

        "Agar main tumhe chocolate doon, toh hug milega? 🍫🤗",

        "Kya tum mere saath ek romantic date par chalogi? 🌹",

        "Kya main tumhare liye special hoon? 🥹❤️",

        "Kya tum mere saath budhape tak rehogi? 👴🏻👵🏻❤️",

        "Aur sabse important... Kya tum mujhse pyaar karti ho? ❤️"

    ];


    // ==========================
    // VARIABLES
    // ==========================

    let currentQuestion = 0;


    const questionElement =
        document.getElementById("question");


    const progressElement =
        document.getElementById("progress");


    const yesButton =
        document.getElementById("yes");


    const noButton =
        document.getElementById("no");


    const buttonArea =
        document.getElementById("buttonArea");


    const messageElement =
        document.getElementById("message");


    // ==========================
    // SHOW QUESTION
    // ==========================

    function showQuestion() {

        questionElement.innerText =
            questions[currentQuestion];


        progressElement.innerText =
            "Question " +
            (currentQuestion + 1) +
            " of " +
            questions.length;


        messageElement.innerText = "";


        // YES stays at same position

        yesButton.style.left = "35%";

        yesButton.style.top = "40px";


        // NO starts from same position

        noButton.style.left = "55%";

        noButton.style.top = "40px";

    }



    // ==========================
    // MOVE NO BUTTON
    // ==========================

    function moveNoButton(event) {

        if (event) {

            event.preventDefault();

        }


        const areaWidth =
            buttonArea.clientWidth;


        const areaHeight =
            buttonArea.clientHeight;


        const buttonWidth =
            noButton.offsetWidth;


        const buttonHeight =
            noButton.offsetHeight;


        const maxX =
            areaWidth - buttonWidth;


        const maxY =
            areaHeight - buttonHeight;


        const randomX =
            Math.max(
                0,
                Math.random() * maxX
            );


        const randomY =
            Math.max(
                0,
                Math.random() * maxY
            );


        noButton.style.left =
            randomX + "px";


        noButton.style.top =
            randomY + "px";


        messageElement.innerText =
            "Nice try 😜❤️";

    }



    // ==========================
    // DESKTOP
    // ==========================

    noButton.addEventListener(
        "mouseenter",
        moveNoButton
    );


    // ==========================
    // MOBILE
    // ==========================

    noButton.addEventListener(
        "touchstart",
        moveNoButton,
        {
            passive: false
        }
    );


    // ==========================
    // CLICK
    // ==========================

    noButton.addEventListener(
        "click",
        moveNoButton
    );



    // ==========================
    // YES BUTTON
    // ==========================

    yesButton.addEventListener(
        "click",
        function() {

            currentQuestion++;


            if (
                currentQuestion <
                questions.length
            ) {

                showQuestion();

            }

            else {

                document
                    .getElementById(
                        "questionScreen"
                    )
                    .style.display = "none";


                document
                    .getElementById(
                        "finalScreen"
                    )
                    .style.display = "block";

            }

        }
    );



    // ==========================
    // START
    // ==========================

    showQuestion();

</script>


</body>

</html>
