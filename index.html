<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            background: linear-gradient(135deg, #ffd6e5, #fff5f8);
        }

        .box {
            width: 90%;
            max-width: 600px;
            min-height: 400px;
            background: white;
            border-radius: 25px;
            text-align: center;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,.15);
        }

        h1 {
            color: #ff4778;
        }

        #question {
            font-size: 23px;
            font-weight: bold;
            margin: 50px 0;
        }

        #area {
            position: relative;
            height: 150px;
        }

        button {
            position: absolute;
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #yes {
            left: 35%;
            background: #ff4778;
            color: white;
        }

        #no {
            left: 55%;
            background: #eee;
            color: #333;
        }

        #final {
            display: none;
        }

        #final img {
            max-width: 90%;
            border-radius: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <div id="game">

        <div style="font-size:50px;">❤️</div>

        <h1>One Little Question...</h1>

        <div id="question"></div>

        <div id="area">

            <button id="yes">YES ❤️</button>

            <button id="no">NO 😜</button>

        </div>

        <div id="msg"></div>

    </div>


    <div id="final">

        <div style="font-size:50px;">🥹❤️</div>

        <h1>You Said YES! 🎉</h1>

        <p>
            I knew you would say YES! 😍
            <br><br>
            You are my favourite person ❤️
            <br>
            Forever Us 🥰
        </p>

        <img src="final-photo.jpg">

        <h2>❤️ I Love You ❤️</h2>

    </div>

</div>


<script>

const questions = [
    "Kya tumne mujhe propose kiya tha? 💍",
    "Kya main tumhara favourite notification hoon? 📱❤️",
    "Kya main tumhari favourite headache hoon? 😂❤️",
    "Kya tum mere saath lifetime bakchodi karogi? 😜",
    "Agar main chocolate doon toh hug milega? 🍫🤗",
    "Kya tum mere saath romantic date par chalogi? 🌹",
    "Kya main tumhare liye special hoon? 🥹❤️",
    "Kya tum mere saath budhape tak rahogi? 👴🏻👵🏻❤️",
    "Kya tum mujhse pyaar karti ho? ❤️"
];

let index = 0;

const question = document.getElementById("question");
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const area = document.getElementById("area");
const msg = document.getElementById("msg");

function showQuestion() {

    question.innerHTML = questions[index];

    yes.style.left = "35%";
    yes.style.top = "20px";

    no.style.left = "55%";
    no.style.top = "20px";

    msg.innerHTML = "";
}

function moveNo() {

    const maxX = area.clientWidth - no.offsetWidth;
    const maxY = area.clientHeight - no.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    no.style.left = x + "px";
    no.style.top = y + "px";

    msg.innerHTML = "Nice try 😜❤️";
}


// DESKTOP
no.addEventListener("mouseover", moveNo);


// MOBILE
no.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveNo();
});


// IF SOMEHOW CLICKED
no.addEventListener("click", function(e) {
    e.preventDefault();
    moveNo();
});


// YES
yes.addEventListener("click", function() {

    index++;

    if (index < questions.length) {

        showQuestion();

    } else {

        document.getElementById("game").style.display = "none";

        document.getElementById("final").style.display = "block";

    }

});

showQuestion();

</script>

</body>
</html>
